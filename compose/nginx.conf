# nginx in front of the game replicas: WebSockets spread over both, with no sticky sessions
# (every room is in Redis, so any replica can serve any player). Later it also serves the web UI.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  # The read-only image's writable place is /tmp.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  log_format json escape=json '{"time":"$time_iso8601","service":"nginx","remote":"$remote_addr","request":"$request","status":$status,"upstream":"$upstream_addr","request_time":$request_time}';
  access_log /dev/stdout json;

  # Docker's DNS, so the game replicas' names are looked up again when a container comes back
  # with a new address.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream game {
    zone game 64k;
    # Round robin. A replica that refuses a connection is skipped for 5 s.
    server game-1:8080 resolve max_fails=1 fail_timeout=5s;
    server game-2:8080 resolve max_fails=1 fail_timeout=5s;
  }

  server {
    listen 8080;

    # nginx's own liveness, for its healthcheck.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /socket.io/ {
      proxy_pass http://game;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Socket.IO pings every 10 s; an idle WebSocket lives as long as the pings arrive.
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      # A replica that's down refuses the connection: try the other one. One that's draining or
      # not ready answers the WebSocket upgrade with 400, which nginx can't retry; the client
      # reconnects, and round robin sends it on. (Open-source nginx has no active health checks:
      # in the cluster, readiness takes a draining pod out of the Service instead.)
      proxy_next_upstream error timeout;
    }

    location / {
      default_type text/plain;
      return 404 "not here yet: the web UI comes with apps/web\n";
    }
  }
}
