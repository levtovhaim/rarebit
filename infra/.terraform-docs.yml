# terraform-docs for every module under infra/modules: the inputs/outputs table between the
# BEGIN_TF_DOCS and END_TF_DOCS markers in the module's README.md. The text around the markers is
# written by hand. Regenerate: terraform-docs --config infra/.terraform-docs.yml infra/modules/<name>
formatter: markdown table

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  html: false
  lockfile: false
  required: true
  sensitive: true
  type: true
