extends: default

rules:
  # GitHub Actions uses `on:` as a key.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
  # Long lines are a warning, not a failure (scripts embedded in workflows run long).
  line-length:
    max: 120
    level: warning
