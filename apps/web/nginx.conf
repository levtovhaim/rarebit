# nginx for the web UI image (apps/web/Dockerfile): the built UI as static files, plus the runtime
# contract every service has (CLAUDE.md → Rules, rule 7). nginx runs as PID 1 without the base
# image's entrypoint scripts, as uid 101, on a read-only root filesystem; its one writable place
# is /tmp (a tmpfs locally, an emptyDir in Kubernetes).
#
# One build at any path (ADR 0026): the files are served under any path prefix, so a preview at
# /pr-12/ needs no rebuild and no runtime config. The ingress decides which prefixes reach this
# server; the socket path (<prefix>socket.io) goes to the game, never here.

# One worker: static files over sendfile are cheap, and the pod scales out, not up. "auto" would
# count the node's CPUs, not the pod's CPU limit.
worker_processes 1;
pid /tmp/nginx.pid;
# nginx's own messages (startup, configuration errors) in its plain format; requests are logged
# as JSON below.
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  # nginx creates these at startup, even though this server never proxies or buffers a body.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  # $app_version: the git SHA, written at build time (apps/web/Dockerfile).
  include /etc/nginx/rarebit-version.conf;

  log_format json escape=json '{"time":"$time_iso8601","service":"web","version":"$app_version",'
                              '"remote":"$remote_addr","forwarded_for":"$http_x_forwarded_for",'
                              '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
                              '"request_time":$request_time,"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  server_tokens off;
  # Longer than the load balancer's idle timeout (60 s on an ALB), so nginx never closes a
  # connection the load balancer is about to reuse.
  keepalive_timeout 75s;

  # The build ships every text file precompressed next to the original (name.gz): nginx sends
  # that file to clients that accept gzip, with no compression work per request.
  gzip_static on;
  gzip_vary on;

  server {
    listen 8080;
    root /srv/web;
    # Redirects carry the path only: behind a load balancer, nginx's own host and port aren't the
    # ones the browser used.
    absolute_redirect off;

    # On every response from this server. By default a location that sets an add_header of its own
    # (the caching rules below) drops all of these; "merge" (nginx 1.29.3 and later) adds the
    # location's headers to them instead. An older nginx fails the build's `nginx -t` here rather
    # than serving pages without them.
    add_header_inherit merge;
    # - CSP: scripts, styles and fonts from the page's own origin only; the WebSocket goes to the
    #   same origin ('self' covers ws: and wss: there); the favicon is a data: URL.
    # - no-referrer: page URLs carry the room code (?room=).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # Liveness: nginx answers.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Readiness: the files are in the image, so there's no dependency to check. On SIGQUIT (the
    # image's stop signal) nginx closes its listening socket and finishes the requests in flight,
    # so from then on the probe fails: not ready while draining.
    location = /readyz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Prometheus text format, from nginx's connection counters (the stub_status variables). Request
    # rates and latencies come from the load balancer. Only for scrapes that reach the pod
    # directly: a request that came through a proxy or the load balancer carries
    # X-Forwarded-For and gets 404.
    location = /metrics {
      access_log off;
      if ($http_x_forwarded_for) {
        return 404;
      }
      default_type "text/plain; version=0.0.4";
      return 200 "# HELP nginx_connections_active Open client connections, idle keep-alive ones included.\n# TYPE nginx_connections_active gauge\nnginx_connections_active $connections_active\n# HELP nginx_connections_reading Connections whose request nginx is reading.\n# TYPE nginx_connections_reading gauge\nnginx_connections_reading $connections_reading\n# HELP nginx_connections_writing Connections nginx is writing a response to.\n# TYPE nginx_connections_writing gauge\nnginx_connections_writing $connections_writing\n# HELP nginx_connections_waiting Idle keep-alive connections.\n# TYPE nginx_connections_waiting gauge\nnginx_connections_waiting $connections_waiting\n";
    }

    location = /version {
      access_log off;
      default_type application/json;
      return 200 "{\"version\":\"$app_version\",\"nginx\":\"$nginx_version\"}\n";
    }

    # The UI under any path prefix: /assets/x.js and /pr-12/assets/x.js are the same file, and
    # every path that ends in "/" is the page. Prefix segments are plain names (nginx has already
    # resolved any "." and ".." in the path).
    #
    # The asset files have a content hash in their names (index-DBkDR3S9.js): a new build gives
    # a changed file a new name, and index.html names the new files.
    location ~ "^(?:/[A-Za-z0-9_.~-]+)*/assets/(?<asset>[A-Za-z0-9_.-]+)$" {
      # A year, and never revalidated, even on reload: a file with this name never changes.
      # Without `always`, so a 404 (an old page asking for a file a newer build dropped) isn't
      # cached for a year.
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files /assets/$asset =404;
    }

    # The page itself, the one file whose name never changes.
    location ~ "^(?:/[A-Za-z0-9_.~-]+)*/$" {
      # Kept, but checked with nginx on every load ("no-cache" isn't "no-store"): unchanged, it's a
      # 304 with no body (ETag); after a deploy the phone gets the new page, which names the new
      # assets, on its very next load.
      add_header Cache-Control "no-cache";
      try_files /index.html =404;
    }

    # A prefix without its trailing slash (/pr-12): to the page with the slash, which the
    # relative asset URLs need. A last segment with a dot is a file name, and not this.
    location ~ "^(?:/[A-Za-z0-9_.~-]+)*/[A-Za-z0-9_~-]+$" {
      return 301 $uri/;
    }

    # Anything else: a file outside assets/, a path with other characters.
    location / {
      return 404;
    }
  }
}
