# Lint hooks behind `make check` (and, later, CI). The tools come from .mise.toml, the one place
# versions are pinned; only the generic file checks come from a hook repository (pinned by SHA).
# The git hook itself is not installed: run `make check` before every commit (CLAUDE.md → Commands).
minimum_pre_commit_version: "4.7.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets in staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: actionlint (GitHub Actions)
        entry: actionlint
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: zizmor
        name: zizmor (GitHub Actions security)
        entry: zizmor --offline
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: hadolint
        name: hadolint (Dockerfiles)
        entry: hadolint
        language: system
        types: [dockerfile]
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
      - id: terraform-fmt
        name: terraform fmt
        entry: bash -c 'rc=0; for f in "$@"; do terraform fmt -check -diff "$f" || rc=1; done; exit $rc' --
        language: system
        files: \.(tf|tfvars)$
