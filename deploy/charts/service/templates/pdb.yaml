{{- if and (eq .Values.mode "deployment") (gt (int .Values.replicas) 1) }}
# A node drain takes at most one pod at a time. A single replica gets no budget: it would block every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
{{- end }}
