{{- if eq .Values.mode "deployment" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.portName }}
      port: {{ .Values.port }}
      targetPort: {{ .Values.portName }}
    {{- with .Values.metricsPort }}
    # For Prometheus only: no Ingress ever routes to it.
    - name: metrics
      port: {{ . }}
      targetPort: metrics
    {{- end }}
{{- end }}
