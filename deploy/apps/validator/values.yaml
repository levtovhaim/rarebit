# The validator's HTTP API (apps/validator/README.md → Deploy). Its migrate Job is deploy/apps/validator-migrate.
# The database URL is the environment's (deploy/envs/<env>/validator/values.yaml, extraEnv).
owner: haimlevtov # catalog/validator.yaml
tier: "1"
image:
  repository: rarebit/validator
args: [serve]
replicas: 2
port: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

