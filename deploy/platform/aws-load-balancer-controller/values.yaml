# The AWS Load Balancer Controller (chart eks/aws-load-balancer-controller 3.6.3, app v3.6.3, released
# 2026-11-13), installed into kube-system by hand for now (docs/runbooks/eks.md, ADR 0048). It turns the
# game's and the web UI's Ingresses into the one ALB of IngressGroup rarebit. Its IAM role comes
# through Pod Identity (infra/modules/eks): the association names this service account.
# vpcId is set at install time from the network unit's output.
clusterName: rarebit-prod
region: eu-central-1

serviceAccount:
  create: true
  name: aws-load-balancer-controller

# Two replicas: its webhook adds the readiness gates to new pods in the app namespace, and while no
# replica answers, those pods can't be created.
replicaCount: 2

# The controller's image by digest (the chart's v3.6.3 tag).
image:
  repository: public.ecr.aws/eks/aws-load-balancer-controller
  tag: v3.6.3@sha256:bc9bee8bc5b2b9f69fe914c06ed3ddb24ce9c94e234cf101dff1ec04693a6974

# The controller doesn't take over Services of type LoadBalancer (it would make NLBs of them). The
# shared chart only makes ClusterIP Services, so none of ours is one.
enableServiceMutatorWebhook: false

# The ALB, its target groups and security groups carry the project's tags (CLAUDE.md rule 6), so the
# cost and the leak check see them.
defaultTags:
  Project: rarebit
  Env: prod
  ManagedBy: aws-load-balancer-controller
  Owner: user:haimlevtov

# One replica at a time may go during a drain: its webhook must keep answering.
podDisruptionBudget:
  maxUnavailable: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
